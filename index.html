<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madarsa Gulshan-e-Madina Panaravad</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#123}
header{background:linear-gradient(135deg,#075e3d,#c99a2e);color:#fff;padding:20px;text-align:center}
.wrap{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 3px 14px rgba(0,0,0,0.08)}
input,select,button,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:9px;font-size:15px}
button{background:#075e3d;color:#fff;border:0;font-weight:bold;cursor:pointer}
.gold{background:#b88620}
.danger{background:#a51d2d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.hidden{display:none}
.msg{padding:10px;border-radius:8px;background:#fff3cd;margin:8px 0}
.studentPhoto{width:75px;height:75px;border-radius:50%;object-fit:cover;background:#ddd;border:2px solid #c99a2e}
.molanaPhoto{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #b88620;background:#eee}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
.molana-card{background:linear-gradient(135deg,#fbfdfc,#eff7f2);border:2px solid #075e3d;border-radius:15px;padding:15px;margin-bottom:15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.contact-chip{display:inline-block;background:#075e3d;color:#fff;padding:4px 10px;border-radius:20px;font-size:13px;text-decoration:none}
.trustee-chip{display:inline-block;background:#b88620;color:#fff;padding:4px 10px;border-radius:20px;font-size:13px;text-decoration:none}
</style>
</head>
<body>

<header>
  <h1>🕌 Madarsa Gulshan-e-Madina Panaravad</h1>
  <div>Madarsa Management Portal</div>
</header>

<div class="wrap">
  <!-- Login Screen -->
  <div id="login" class="card">
    <h2>🔐 Login Karein</h2>
    <div class="grid">
      <select id="role">
        <option value="student">Student</option>
        <option value="admin">Admin</option>
        <option value="teacher">Teacher</option>
      </select>
      <input id="uid" placeholder="Student ID (Jaise: MG001)">
      <input id="pin" type="password" placeholder="PIN Daalein">
    </div>
    <button onclick="loginNow()">Login</button>
    <div id="loginMsg" class="msg">Student: <b>MG001 se MG050</b> | Admin: <b>admin / 7860</b></div>
  </div>

  <!-- Main App Screen -->
  <div id="app" class="hidden">
    <div class="molana-card">
      <div style="flex:1">
        <h3 style="margin:0 0 5px 0;color:#075e3d">Molana Jafar Raza</h3>
        <div>📞 Mobile: <a class="contact-chip" href="tel:8140851723">8140851723</a></div>
        <div style="margin-top:5px">🤝 Trustee: <a class="trustee-chip" href="tel:9898935542">9898935542</a></div>
      </div>
      <div>
        <b id="welcome"></b><br>
        <button class="danger" style="width:auto;padding:7px 15px;margin-top:5px" onclick="location.reload()">Logout</button>
      </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="hidden">
      <div class="card">
        <h2>🛠️ Admin Dashboard</h2>
        <div class="grid">
          <button onclick="showStudents()">👥 Sabhi 50 Students Dekhein / Edit</button>
          <button class="gold" onclick="backup()">💾 Naya Backup Download</button>
        </div>
      </div>
      <div id="studentsBox" class="card hidden">
        <h2>Sabhi Students Ki List</h2>
        <div id="studentsList"></div>
      </div>
    </div>

    <!-- Student Panel -->
    <div id="studentPanel" class="hidden">
      <div class="card">
        <h2>👤 Student Profile</h2>
        <div id="myData"></div>
      </div>
    </div>
  </div>
</div>

<script>
// 50 Students Default Permanent List (Bina restore ke sabhi phone me khulegi)
const defaultStudents = [];
for (let i = 1; i <= 50; i++) {
  let id = "MG" + String(i).padStart(3, '0');
  defaultStudents.push({
    id: id,
    name: "Student " + id,
    father: "Vali",
    class: "Darse Nizami",
    mobile: "",
    pin: "7860", // Shuruati default pin sabka 7860 rakha gaya hai
    proof: id
  });
}

const KEY = 'madarsa_live_data_v1';
let D = JSON.parse(localStorage.getItem(KEY) || 'null');
if (!D || !D.students || D.students.length === 0) {
  D = { students: defaultStudents };
  localStorage.setItem(KEY, JSON.stringify(D));
}

const $ = id => document.getElementById(id);
const clean = x => String(x || '').trim().toLowerCase();

function loginNow() {
  let role = $('role').value;
  let uid = clean($('uid').value);
  let pin = clean($('pin').value);

  if (role === 'admin') {
    if ((uid === 'admin' && pin === '7860') || (uid === '7860' && pin === 'admin')) {
      openDashboard('admin', 'Admin Saheb');
      return;
    }
  } else if (role === 'teacher') {
    if (uid === 'teacher' && pin === '123456') {
      openDashboard('teacher', 'Teacher');
      return;
    }
  } else {
    let s = D.students.find(x => clean(x.id) === uid && clean(x.pin) === pin);
    if (s) {
      openDashboard('student', s.name, s);
      return;
    }
  }
  $('loginMsg').innerHTML = '❌ Galat ID ya PIN! Dubara check karein.';
}

function openDashboard(role, name, studentData) {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('welcome').innerText = 'Khush Aamdeed: ' + name;

  if (role === 'admin') {
    $('adminPanel').classList.remove('hidden');
  } else if (role === 'student') {
    $('studentPanel').classList.remove('hidden');
    $('myData').innerHTML = `
      <p><b>Student Name:</b> ${studentData.name}</p>
      <p><b>Student ID:</b> ${studentData.id}</p>
      <p><b>Darja (Class):</b> ${studentData.class}</p>
      <p><b>Walid ka Naam:</b> ${studentData.father}</p>
      <p style="color:green;font-weight:bold">Status: Madarsa Portal par verified hai</p>
    `;
  }
}

function showStudents() {
  $('studentsBox').classList.remove('hidden');
  $('studentsList').innerHTML = D.students.map(s => `
    <div style="border-bottom:1px solid #ddd;padding:8px 0">
      <b>${s.id}</b> — ${s.name} (PIN: <b>${s.pin}</b>)
    </div>
  `).join('');
}

function backup() {
  let a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(D));
  a.download = 'madarsa_updated_backup.json';
  a.click();
}
</script>
</body>
          </html>
